[tox]
envlist = py310, py311, py312, py313, py314, docs, packaging

[testenv]
deps = pytest>=7.4
commands = python -m pytest libtaxii

[testenv:docs]
deps =
    Sphinx>=7.2
    sphinx-rtd-theme>=2
commands =
    sphinx-build -b doctest docs docs/_build/doctest
    sphinx-build -b html docs docs/_build/html

[testenv:packaging]
deps =
    build>=1
    twine>=5
commands =
    python -m build --outdir {envtmpdir}/dist
    python -m twine check --strict {envtmpdir}/dist/*
