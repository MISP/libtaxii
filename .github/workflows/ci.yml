name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e . 'pytest>=7.4'
      - run: uv run --no-project python -m pytest libtaxii

  docs-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.14
      - run: uv pip install -r requirements.txt
      - run: uv run --no-project tox -e docs,packaging
